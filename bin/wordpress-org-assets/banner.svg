<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="772" height="250">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#252c33"/>
      <stop offset="60%" stop-color="#1a1f24"/>
      <stop offset="100%" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2271b1" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#2271b1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2271b1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bglow" cx="14%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#2271b1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2271b1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a323a"/>
      <stop offset="100%" stop-color="#181c21"/>
    </linearGradient>
    <radialGradient id="iglow" cx="26%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#2271b1" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#2271b1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2271b1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ibar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f9fe0"/>
      <stop offset="100%" stop-color="#2271b1"/>
    </linearGradient>
    <clipPath id="isquircle">
      <rect x="6" y="6" width="244" height="244" rx="56"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="772" height="250" fill="url(#bbg)"/>
  <rect x="0" y="0" width="772" height="250" fill="url(#bglow)"/>
  <rect x="0" y="0" width="772" height="250" fill="url(#dots)"/>

  <!-- ghost .md watermark, bleeding off the right edge -->
  <text x="560" y="205" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-weight="700"
        font-size="230" letter-spacing="-6" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="2">.md</text>

  <rect x="0" y="0" width="772" height="4" fill="url(#topline)"/>

  <!-- icon badge -->
  <g transform="translate(40,45) scale(0.625)">
    <g clip-path="url(#isquircle)">
      <rect x="6" y="6" width="244" height="244" fill="url(#ibg)"/>
      <rect x="6" y="6" width="244" height="244" fill="url(#iglow)"/>
    </g>
    <rect x="7" y="7" width="242" height="242" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="86" y="60" width="84" height="9" rx="4.5" fill="url(#ibar)"/>
    <rect x="86" y="78" width="52" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="70" y="150" width="16" height="16" rx="4" fill="#57a6e3"/>
    <text x="94" y="168" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="64" fill="#f5f7fa" letter-spacing="-1">md</text>
    <path d="M 112 196 L 128 210 L 144 196" fill="none" stroke="#57a6e3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title block -->
  <text x="236" y="112" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-weight="700" font-size="40" letter-spacing="-0.5" fill="#f5f7fa">System Markdown Alternate</text>
  <text x="236" y="146" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-weight="400" font-size="19" fill="#9aa4ad">Clean Markdown for LLMs, agents &amp; AI tools</text>

  <text x="236" y="187" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="18">
    <tspan fill="#8b95a1">/my-post</tspan>
    <tspan fill="#57a6e3" dx="10">&#8594;</tspan>
    <tspan fill="#e8edf1" dx="10">/my-post</tspan><tspan fill="#57a6e3" font-weight="700">.md</tspan>
  </text>
</svg>
