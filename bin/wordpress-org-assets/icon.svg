<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252c33"/>
      <stop offset="100%" stop-color="#171b1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#2271b1" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#2271b1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2271b1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f9fe0"/>
      <stop offset="100%" stop-color="#2271b1"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="6" y="6" width="244" height="244" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="6" y="6" width="244" height="244" fill="url(#bg)"/>
    <rect x="6" y="6" width="244" height="244" fill="url(#glow)"/>
  </g>
  <rect x="7" y="7" width="242" height="242" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- accent bar: document / conversion cue -->
  <rect x="86" y="60" width="84" height="9" rx="4.5" fill="url(#bar)"/>
  <rect x="86" y="78" width="52" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>

  <!-- .md wordmark -->
  <rect x="70" y="150" width="16" height="16" rx="4" fill="#57a6e3"/>
  <text x="94" y="168" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="64" fill="#f5f7fa" letter-spacing="-1">md</text>

  <!-- downward chevron: output cue -->
  <path d="M 112 196 L 128 210 L 144 196" fill="none" stroke="#57a6e3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
