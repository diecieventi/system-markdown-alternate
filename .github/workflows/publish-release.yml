name: Publish release

# Publishes the GitHub Release for one or more version tags, with the
# installable plugin zip attached — the auto-generated "Source code" archives
# are not installable.
#
# Manual on purpose: this is the one release step that stays a decision, so it
# runs only when started from Actions → "Publish release" → "Run workflow".
# That button works from the GitHub mobile app, which is the point: no
# workstation, no `git fetch --tags`, no forgotten asset.
#
# The `tags` input defaults to the most recent vX.Y.Z, so the usual case is a
# single tap with nothing to fill in. Fill it in to publish older tags, one or
# several separated by spaces — handy for backfilling.
# Idempotent: a tag that already has a Release is reported and left alone.
#
# Only the newest tag in the repository is ever marked "Latest". Without that,
# backfilling an old tag would move the Latest badge backwards, because the API
# marks a newly created Release as latest by default.
#
# NOTE — this does not start the SVN deploy. "Deploy to WordPress.org" triggers
# on `release: published`, and GitHub deliberately raises no workflow-starting
# event from the default GITHUB_TOKEN. That workflow is inactive anyway and has
# its own manual trigger; to chain the two once wordpress.org is live, add a
# `RELEASE_TOKEN` secret (a PAT with `contents: write`) — it is picked up below
# automatically, and events it raises do start other workflows.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags to publish, space-separated (leave empty for the most recent one)'
        type: string
        default: ''

# Required to create a Release with the default GITHUB_TOKEN.
permissions:
  contents: write

# Never let two runs publish the same tag.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build the zip and publish the Release
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed both to resolve the default and for
          # `gh release create --notes-from-tag`, which reads the annotated
          # tag's message locally.
          fetch-depth: 0

      - name: Resolve the tags
        id: resolve
        env:
          REQUESTED: ${{ inputs.tags }}
        run: |
          NEWEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$NEWEST" ]; then
            echo '::error::the repository has no vX.Y.Z tag yet — run "Release tag" first.'
            exit 1
          fi

          TAGS="$REQUESTED"
          if [ -z "$TAGS" ]; then
            TAGS="$NEWEST"
            echo "==> No tag given, using the most recent one: $NEWEST"
          else
            for TAG in $TAGS; do
              if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
                echo "::error::tag $TAG does not exist."
                exit 1
              fi
            done
          fi

          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Skip the tags that already have a Release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.resolve.outputs.tags }}
        run: |
          PENDING=''
          for TAG in $TAGS; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "--  $TAG already has a Release, skipped."
            else
              PENDING="${PENDING:+$PENDING }$TAG"
            fi
          done

          if [ -z "$PENDING" ]; then
            echo '::notice::nothing to publish — every requested tag already has a Release.'
          else
            echo "==> To publish: $PENDING"
          fi

          echo "tags=$PENDING" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.pending.outputs.tags != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Build the zip and publish a Release for each tag
        if: steps.pending.outputs.tags != ''
        env:
          # A PAT in RELEASE_TOKEN, when present, makes the published Release
          # able to start other workflows (see the note at the top).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAGS: ${{ steps.pending.outputs.tags }}
          NEWEST: ${{ steps.resolve.outputs.newest }}
        run: |
          for TAG in $TAGS; do
            # Built from the tagged tree rather than taken from the committed
            # DIST/, so the asset always matches the released source.
            #
            # --force because DIST/system-markdown-alternate.zip is tracked and
            # bin/build.sh rewrites it: without it the second iteration aborts
            # with "local changes would be overwritten by checkout".
            git checkout --quiet --force --detach "$TAG"
            bash bin/build.sh

            # Body = the tag notes, i.e. that version's readme.txt changelog.
            LATEST=false
            if [ "$TAG" = "$NEWEST" ]; then
              LATEST=true
            fi

            gh release create "$TAG" \
              --title "$TAG" \
              --notes-from-tag \
              --latest="$LATEST" \
              DIST/system-markdown-alternate.zip
            echo "==> $TAG published with the plugin zip attached (latest=$LATEST)."
          done
