name: Documentation site

# Builds documentation/ with Astro Starlight and publishes it to GitHub Pages.
#
# The path filter is safe here because this workflow is NOT a required check:
# branch protection gates on the three CI checks, and ci.yml deliberately has no
# path filters, so a documentation-only pull request still gets them and can be
# merged. Adding a path filter to a *required* check would leave it permanently
# pending and block every PR that does not touch the filtered paths.
on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so a run that is
# already publishing finishes rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
